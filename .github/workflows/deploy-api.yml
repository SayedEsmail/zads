name: zads-api

on:
  push:
    branches:
      - main
    paths:
      - 'zads-api/**'
      - '.github/workflows/deploy-api.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'zads-api/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-and-test:
    name: Build & Test Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zads
          POSTGRES_PASSWORD: zads-ci-only
          POSTGRES_DB: zads_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zads"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: zads-api

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # pnpm-lock.yaml is lockfile v9; pnpm 8 ignored it and resolved unpinned versions.
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm9-store-${{ hashFiles('zads-api/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm9-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Prisma Generate
        run: pnpm exec prisma generate

      - name: Lint Checks
        run: pnpm run lint
        continue-on-error: true # Suppress non-blocking styling warnings

      - name: API integration tests (Postgres service)
        run: pnpm run test:local
        env:
          TEST_DATABASE_URL: postgresql://zads:zads-ci-only@localhost:5432/zads_test?schema=public

  deploy:
    name: Deploy API to Vercel
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        if: env.VERCEL_TOKEN != ''
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_API }}
          vercel-args: '--prod'
          vercel-version: 'latest'
          working-directory: ./zads-api
